# A weekly `cargo deny check advisories` over Cargo.lock: a RustSec advisory published for a crate that
# is already in the lock file shows up here, without waiting for the next pull request to run the `deny` job of
# ci.yml. Not a required check (the ruleset requires that `deny` job on every change); a failed run is GitHub's
# usual notification of a failed scheduled workflow. It can also be started by hand (`gh workflow run
# advisories.yml`). The action is pinned by commit SHA like the ones in ci.yml and bumped by dependabot.
name: advisories

on:
  schedule:
    # Mondays at 06:17 UTC, off the full hour when scheduled runs queue up.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The default features, as the exe is built and as the deny job of ci.yml checks.
          arguments: ""
          command: check advisories
