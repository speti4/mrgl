[workspace]
resolver = "3"
members = ["crates/mrgl-core", "crates/mrgl-cli", "crates/mrgl-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/speti4/mrgl"
# Tauri 2.12 and tauri-plugin-dialog require 1.90 (task 001). The msrv job reads it from here; the local
# command in CONTRIBUTING.md, "Checks before a commit", names it too.
rust-version = "1.90"
# Never published to crates.io; also lets cargo-deny accept the path dependencies.
publish = false

[workspace.dependencies]
mrgl-core = { path = "crates/mrgl-core" }
# Argument parsing for the `mrgl` command line (derive): subcommands, flags, help (task 001 / D-002).
clap = { version = "4.5", features = ["derive"] }
# The state sidecar's `state.json` (D-003), `release.json` from the sources, the `--json` output and the
# app's IPC types (task 001).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One error type per module with a `Display` that is the plain English line of the voice (task 001 / D-005).
thiserror = "2"
# Reads the addon zips the install engine unpacks into staging (task 004): ZIP is the one container every
# source ships, and std has no archive reader. Default features off; deflate comes through flate2 on the pure
# Rust zlib-rs backend, so no C code, no AES, no bzip2 or zstd the addon zips never use.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# SHA-256 of every installed file for the state sidecar's file list (D-003, task 004): a stable hash the
# repair and rollback of later tasks can compare against; std has no hash function meant for files.
sha2 = "0.10"
# The HTTP client of the sources (task 003): the GitHub releases API and the asset downloads, blocking, with
# rustls compiled in (no OpenSSL, nothing to install, D-002); std has no HTTP and Tauri's own client belongs to
# the window. Its `ring` provider compiles C and assembly through the MSVC tools the build already needs.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# The window, IPC, async runtime and asset embedding of the D-002 shell, on the system web view (WebView2 on
# Windows 11): one portable zip with two exes, nothing to install (task 001).
tauri = "2"
# Build script: Windows icon/version resource, app manifest and capability schemas (task 001).
tauri-build = "2"
# The native folder picker for the game folder and the backup folder; registered in the shell, its first
# command comes with the flavor list (task 009).
tauri-plugin-dialog = "2"
# Links to an addon's project page open in the system browser; registered in the shell, its first command
# comes with the flavor list (task 009).
tauri-plugin-opener = "2"
# The running-client check (task 023): one Toolhelp snapshot, the image path of each process and the 8.3
# short form of the flavor folder, straight from the Windows SDK bindings Tauri already pulls in; a process
# crate would add a tree of crates for three calls. The game root discovery (task 020) reads the launcher's
# `InstallPath` registry value through the same bindings (`Win32_System_Registry`: open, query, close), so
# no registry crate joins for one string value. The time-zone conversion behind the dated backup names and
# the zip timestamps (task 013) is two more calls from the same bindings, so no date crate either. The dev
# addon junctions (task 005) are one `DeviceIoControl` with `FSCTL_SET_REPARSE_POINT` (`Win32_System_IO`,
# `Win32_System_Ioctl`), so no junction crate either. An expandable registry value of the discovery (task
# 043) is one `ExpandEnvironmentStringsW` (`Win32_System_Environment`). The API keys (task 093) are
# generic credentials of the Windows Credential Manager, `CredReadW`, `CredWriteW`, `CredDeleteW` and
# `CredFree` (`Win32_Security_Credentials`), so no keyring crate either.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

# The release builds (the zip of task 001's release script): fat LTO and one codegen unit for size and speed,
# symbols stripped. Panics keep unwinding (the default), so a panic in a command can be caught and reported
# rather than aborting the process outright.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
