[package]
name = "mrgl-core"
description = "Flavor detection, AddOns scan, sources, install engine, state sidecar and the voice table for mrgl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The TOC data and the flavor of a game folder serialize for `--json` and the window, and `config.json`
# under the mrgl home folder round-trips through serde_json (task 002); the state sidecar of task 004
# builds on the same two.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# The process list behind the running-client check (task 023), Windows only; the other targets list nothing
# until the macOS preview (M6).
windows-sys.workspace = true
