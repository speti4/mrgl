[package]
name = "mrgl-core"
description = "Flavor detection, AddOns scan, sources, install engine, state sidecar and the voice table for mrgl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The TOC data and the flavor of a game folder serialize for `--json` and the window, and `config.json`
# under the mrgl home folder round-trips through serde_json (task 002); the state sidecar of task 004
# builds on the same two.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The install engine of task 004: the zip reader and the file hashes of the state sidecar; the WTF backup
# zips of task 013 are written and read back with the same zip crate.
zip.workspace = true
sha2.workspace = true
# The WoWInterface source checks a download against the MD5 its API names (task 094).
md-5.workspace = true
# The GitHub source reads the releases API and downloads an asset (task 003); a test never uses it, the
# folder-backed stub of `sources` stands in.
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
# The process list behind the running-client check (task 023), the launcher's registry value behind the
# game root discovery (task 020), the time-zone conversion of the backup names and timestamps (task 013),
# the dev addon junctions (task 005) and the API keys in the Credential Manager (task 093), Windows only; the other targets list nothing and find nothing
# until the macOS preview (M6).
windows-sys.workspace = true
