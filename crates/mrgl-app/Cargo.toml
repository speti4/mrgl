[package]
name = "mrgl-app"
description = "The mrgl window: Tauri 2 (WebView2) over mrgl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The `_lib` suffix keeps the library's output name apart from the exe's on Windows.
[lib]
name = "mrgl_app_lib"
crate-type = ["lib"]

[[bin]]
name = "mrgl-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mrgl-core.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The stand-in client of the tests (task 118), shared with the other two crates.
mrgl-test-support.workspace = true
# The mock runtime the command tests build the window's commands on (`tauri::test`, task 117): a feature of
# the crate the exe carries already, no new crate, so `cargo deny` and the license page do not change. The
# resolver (3) unifies a dev-dependency's features into dev builds only: `cargo build --release` never
# enables `test`.
tauri = { workspace = true, features = ["test"] }

[build-dependencies]
tauri-build.workspace = true
