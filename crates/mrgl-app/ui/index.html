<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mrgl</title>
    <link rel="stylesheet" href="style.css" />
    <script src="voice.js"></script>
    <script src="state.js"></script>
    <script src="search.js"></script>
    <script src="theme.js"></script>
    <script src="preferences.js"></script>
    <script src="flavors.js"></script>
    <script src="actions.js"></script>
    <script src="toolbox.js"></script>
    <script src="data.js"></script>
    <script src="main.js" defer></script>
  </head>
  <body>
    <nav id="sidebar" aria-label="Flavors">
      <h1 class="brand">mrgl</h1>
      <ul id="flavor-list" class="flavor-list"></ul>
      <div class="sidebar-footer">
        <button id="choose-root" type="button" class="ghost">Game folder…</button>
        <button id="copy-diagnostics" type="button" class="ghost">Copy diagnostics</button>
        <button id="theme-toggle" type="button" class="ghost"></button>
        <label class="check"><input id="serious-toggle" type="checkbox" /> serious: no murloc</label>
      </div>
    </nav>

    <main id="main">
      <section id="empty" class="empty" hidden>
        <p id="empty-murloc" class="murloc"></p>
        <p id="empty-plain" class="plain"></p>
        <p class="muted">The World of Warcraft folder holds one folder per flavor (<code>_retail_</code>, <code>_forever_</code>, …).</p>
        <button id="empty-choose" type="button" class="primary">Choose the game folder</button>
      </section>

      <section id="flavor" hidden>
        <header class="flavor-header">
          <div class="flavor-title">
            <h2 id="flavor-name"></h2>
            <p id="flavor-meta" class="muted"></p>
          </div>
          <input id="search" type="search" placeholder="Search name, folder or source" autocomplete="off" spellcheck="false" />
          <div class="flavor-actions">
            <button id="check-updates" type="button" class="secondary">Check for updates</button>
            <button id="update-all" type="button" class="primary"></button>
            <button id="cancel-update" type="button" class="danger" hidden>Cancel</button>
          </div>
        </header>
        <p id="flavor-warnings" class="warnings" hidden></p>
        <div class="view-tabs" role="tablist" aria-label="Flavor views">
          <button id="tab-addons" type="button" role="tab" class="tab" aria-controls="addons-view">Addons</button>
          <button id="tab-toolbox" type="button" role="tab" class="tab" aria-controls="toolbox-view">Toolbox</button>
        </div>
        <div id="addons-view" class="addons-view" role="tabpanel" aria-labelledby="tab-addons">
          <div class="list-head" aria-hidden="true">
            <span>Addon</span><span>Version</span><span>Source</span><span>State</span><span class="forever-head">Forever</span><span></span>
          </div>
          <ul id="addon-list" class="addon-list"></ul>
          <p id="no-match" class="muted no-match" hidden></p>
          <footer id="legend" class="legend" aria-label="Legend"></footer>
        </div>
        <div id="toolbox-view" class="toolbox-view" role="tabpanel" aria-labelledby="tab-toolbox" hidden>
          <p id="toolbox-client" class="warnings" hidden></p>
          <section class="tool-card" aria-labelledby="sets-title">
            <header class="tool-head">
              <h3 id="sets-title">Addon sets</h3>
              <p id="sets-note" class="note"></p>
            </header>
            <div class="tool-form">
              <label class="field">Set <select id="set-picker"></select></label>
              <label class="field">Apply to <select id="target-picker"></select></label>
              <button id="apply-set" type="button" class="primary">Apply</button>
            </div>
            <ul id="set-addons" class="set-addons" aria-label="The addons of the set"></ul>
            <ul id="set-changes" class="set-changes" aria-label="What the last apply changed" hidden></ul>
          </section>
          <section class="tool-card" aria-labelledby="savedvars-title">
            <header class="tool-head">
              <h3 id="savedvars-title">SavedVariables</h3>
              <p id="savedvars-summary" class="note"></p>
            </header>
            <div class="tool-form">
              <label class="check"><input id="orphans-only" type="checkbox" /> orphans only</label>
              <button id="clean-savedvars" type="button" class="secondary">Move the orphans into a backup zip</button>
            </div>
            <table class="savedvars-table">
              <thead>
                <tr><th scope="col">Addon</th><th scope="col">Where</th><th scope="col">Files</th><th scope="col" class="size">Size</th><th scope="col">Status</th></tr>
              </thead>
              <tbody id="savedvars-rows"></tbody>
            </table>
            <p id="savedvars-empty" class="muted no-match" hidden></p>
          </section>
        </div>
      </section>
    </main>

    <footer id="status" class="status" role="status">
      <span id="status-dot" class="dot"></span>
      <span id="status-murloc" class="status-murloc"></span>
      <span id="status-plain" class="status-plain"></span>
      <span id="version" class="version"></span>
    </footer>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <template id="row-template">
      <li class="row">
        <div class="cell name-cell">
          <span class="name"></span>
          <span class="folder muted"></span>
          <span class="missing"></span>
        </div>
        <div class="cell version-cell">
          <span class="version-now"></span>
          <span class="version-next"></span>
          <span class="version-note muted"></span>
        </div>
        <div class="cell source-cell"><span class="badge"></span></div>
        <div class="cell state-cell"><span class="pill"></span><span class="step muted"></span></div>
        <div class="cell forever-cell"><span class="forever"></span></div>
        <div class="cell actions-cell">
          <details class="row-menu">
            <summary aria-label="Row actions">&#8943;</summary>
            <div class="menu"></div>
          </details>
        </div>
        <div class="progress" hidden><div class="progress-bar"></div></div>
      </li>
    </template>
  </body>
</html>
