[package]
name = "mrgl-cli"
description = "The mrgl command line: scan, list, add, update, remove, link, unlink, backup (the window is crates/mrgl-app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "mrgl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mrgl-core.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The stand-in client and the held files of the tests (task 118), shared with the other two crates.
mrgl-test-support.workspace = true
# The folder key store the end-to-end tests of `key` use (task 124): the resolver (3) unifies a
# dev-dependency's features into dev builds only, so the exe the tests run has it and `cargo build
# --release` never does.
mrgl-core = { workspace = true, features = ["folder-key-store"] }
